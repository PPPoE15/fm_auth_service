name: Lint and Test

on:
  push:
    branches: ["dev", "master"]
  pull_request: {}

permissions:
  contents: read

jobs:

  lint-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: pip install poetry==2.1

    - name: Install dependencies
      run: poetry install --all-groups --no-interaction

    - name: Ruff check
      run: poetry run ruff check --config=pyproject.toml src/ tests/

    - name: Ruff format check
      run: poetry run ruff format --config=pyproject.toml src/ tests/ --check

    - name: Mypy
      run: poetry run mypy --config-file=pyproject.toml src/

    - name: Pytest
      run: poetry run pytest
      env:
        PYTHONPATH: src

  build-and-push:
    needs: [lint-and-test]
    if: ${{ success() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.record.outputs.image_ref }}
      sha: ${{ github.sha }}
      environment: ${{ github.ref_name }}
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - uses: docker/setup-buildx-action@v3

    - name: Define unique image version
      id: version
      run: echo "image=${IMAGE}:${GITHUB_SHA}-${GITHUB_REF_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and publish checked commit
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        target: ${{ github.ref_name }}
        platforms: linux/amd64
        push: true
        tags: |
          ${{ steps.version.outputs.image }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Update branch tag from published digest
      id: branch-alias
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}@${DIGEST}"
        printf 'Обновлён тег %s:%s -> %s\n' "$IMAGE" "$GITHUB_REF_NAME" "$DIGEST"

    - name: Record deployment coordinates
      id: record
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        VERSION: ${{ steps.version.outputs.image }}
      run: |
        set -euo pipefail
        test -n "$DIGEST"
        image_ref="${IMAGE}@${DIGEST}"
        echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
        jq -n --arg image "$image_ref" --arg version "$VERSION" \
          --arg sha "$GITHUB_SHA" --arg environment "$GITHUB_REF_NAME" \
          '{image: $image, version: $version, sha: $sha, environment: $environment}' > image-metadata.json
        cat image-metadata.json >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      with:
        name: image-metadata-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: image-metadata.json
        if-no-files-found: error
